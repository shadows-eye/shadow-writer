name: Build and Publish Shadow Writer to GHCR

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Release Notes and Update Changelog
        id: extract_notes
        if: github.ref_type == 'tag'
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          TODAY=$(date +'%Y-%m-%d')
          
          # Extract notes for GitHub Release
          awk '/^## \['"$VERSION"'\]/ {flag=1; next} /^## \[/ {if(flag) exit} flag' CHANGELOG.md > release_notes.txt
          
          # Update Unreleased to today's date
          sed -i "s/^## \[$VERSION\] - Unreleased/## \[$VERSION\] - $TODAY/" CHANGELOG.md
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: Update CHANGELOG release date for $VERSION [skip ci]" || echo "No changes"
          git push origin HEAD:main

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          body_path: release_notes.txt
          files: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
