name: Build and Publish Shadow Writer to GHCR

on:
  push:
    branches:
      - master
      - main
    tags:
      - '[0-9]*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Extract Version and Release Notes from CHANGELOG.md
        id: changelog
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/}"
            VERSION="${RAW_VER#v}"
          else
            VERSION=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | sed -E 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\]/\1/')
          fi

          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version without leading v from CHANGELOG.md"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          awk '/^## \['"$VERSION"'\]/ {flag=1; next} /^## \[/ {if(flag) exit} flag' CHANGELOG.md > release_notes.txt

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.changelog.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.version }}
          name: ${{ steps.changelog.outputs.version }}
          body_path: release_notes.txt
          files: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
